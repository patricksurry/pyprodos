[build-system]
requires = [
    "setuptools>=42",
    "wheel"
]
build-backend = "setuptools.build_meta"

[project]
name = "pyprodos"
dynamic = ["version"]
requires-python = ">=3.11"
authors = [
    {name = "Patrick Surry", email = "patrick.surry@gmail.com" }
]
description = "Python implementation of Apple ProDOS 8 file system"
readme = {file = "README.md", content-type = "text/markdown"}
keywords = ["prodos", "filesystem"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
dependencies = [
    "bitarray>=3.7.1",
    "rich>=13.0.0",
    "typer>=0.19.2",
]

[project.urls]
Homepage = "https://github.com/patricksurry/pyprodos"
Issues = "https://github.com/patricksurry/pyprodos/issues"

[project.scripts]
prodos = "prodos.cli:app"

[dependency-groups]
dev = [
    "build>=1.2.0",
    "pyright>=1.1.390",
    "pytest>=8.4.2",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "twine>=6.0.0",
]

[tool.setuptools.dynamic]
version = {file = "VERSION"}

[tool.setuptools.package-data]
prodos = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.pyright]
include = ["src", "tests"]
strict = ["src"]
pythonVersion = "3.11"

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "E501",     # long lines: some docstrings reproduce wide figures from the spec
    "E221",     # aligned assignments in tables of constants
    "E241",
]

[tool.uv]
# version is read from VERSION, so rebuild the editable install when it changes
cache-keys = [{ file = "pyproject.toml" }, { file = "VERSION" }]
